[project]
name = "mtg-card-manager"
version = "0.1.0"
description = "Local MTG oracle card catalog with custom translations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "ijson>=3.3,<4.0",
    "motor>=3.6,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pymongo>=4.9,<5.0",
    "requests>=2.32,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
py-modules = ["sync_scryfall"]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
